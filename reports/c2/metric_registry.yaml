neuron_count:
  definition: "Number of unique canonical neuron IDs"
  source: "neurons.parquet"
  classification: "DERIVED"
  units: "nodes"
  scope: "node"
  caveats: "Matches 139,255. Includes both annotated and unannotated proofread neurons."

connection_count:
  definition: "Number of canonical connection rows"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "edges"
  scope: "edge"
  caveats: "Represents unique pre/post/region tuples. Matches 5,342,446."

total_synapse_count:
  definition: "Sum of synapse_count across canonical connections"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "synapses"
  scope: "global"
  caveats: "Matches 50,666,648."

in_degree:
  definition: "Number of distinct canonical pre-neurons projecting to a post-neuron"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "distinct canonical connection rows per post-neuron"
  scope: "node"
  caveats: "This is structural count degree, not weighted."

out_degree:
  definition: "Number of distinct canonical post-neurons projected to by a pre-neuron"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "distinct canonical connection rows per pre-neuron"
  scope: "node"
  caveats: "This is structural count degree, not weighted."

weighted_in_degree:
  definition: "Sum of synapse_count from all canonical connections projecting to a post-neuron"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "synapses"
  scope: "node"
  caveats: "Not a dynamic model weight. Represents physical synapse tally."

weighted_out_degree:
  definition: "Sum of synapse_count across all canonical connections from a pre-neuron"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "synapses"
  scope: "node"
  caveats: "Not a dynamic model weight. Represents physical synapse tally."

graph_density:
  definition: "Observed directed canonical edges divided by possible directed pairs (N * N)"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "fraction"
  scope: "global"
  caveats: "Self-loops affect numerator. Exact formula must be stated."

self_loop_count:
  definition: "Number of connection rows where pre_neuron_id == post_neuron_id"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "edges"
  scope: "global"
  caveats: "Provisional observation was 56,231; requires independent recalculation."

reciprocal_pair_count:
  definition: "Number of neuron pairs (A, B) where A projects to B and B projects to A"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "node pairs"
  scope: "global"
  caveats: "Directional mapping must be precise."

weak_component_count:
  definition: "Number of weakly connected components in the canonical graph"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "components"
  scope: "global"
  caveats: "Calculated ignoring edge directionality."

strong_component_count:
  definition: "Number of strongly connected components in the canonical graph"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "components"
  scope: "global"
  caveats: "Calculated preserving edge directionality."

largest_component_size:
  definition: "Number of nodes in the largest weakly/strongly connected component"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "nodes"
  scope: "global"
  caveats: "Must state whether WCC or SCC is referenced."

region_connection_count:
  definition: "Number of connection rows falling into a specific region"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "edges"
  scope: "region"
  caveats: "Reflects synapse location, not a pre/post compartmentalization."

region_synapse_count:
  definition: "Total synapses falling into a specific region"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "synapses"
  scope: "region"
  caveats: "Reflects synapse location, not a pre/post compartmentalization."

nt_connection_count:
  definition: "Number of connection rows with a specific source_nt_type"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "edges"
  scope: "global"
  caveats: "The source_nt_type is currently propagated with .first() during aggregation. Future datasets with conflicting labels per group will require conflict policy."

nt_synapse_count:
  definition: "Total synapses on edges with a specific source_nt_type"
  source: "connections.parquet"
  classification: "DERIVED"
  units: "synapses"
  scope: "global"
  caveats: "Does NOT map to excitatory/inhibitory sign or conductances."

annotated_cell_type_count:
  definition: "Number of neurons possessing a non-null cell_type annotation"
  source: "neurons.parquet"
  classification: "DERIVED"
  units: "nodes"
  scope: "global"
  caveats: "Derived from consolidated_cell_types.csv.gz. Unannotated neurons remain valid connectome elements."
