[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drosophila-connectome"
version = "0.1.0"
description = "Reproducible FlyWire connectome acquisition and normalization"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
